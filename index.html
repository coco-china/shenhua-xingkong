.hero { position:relative; z-index:1; display:flex; align-items:center; padding:100px 80px; gap:80px; min-height:680px; background:linear-gradient(180deg,#020210 0%,#0A0A20 40%,#0F0F2A 70%,#0A0A14 100%); }

.hero-visual { width:480px; height:480px; border-radius:40px; background:radial-gradient(circle at center,#261460 0%,#0F0F2E 70%,#050510 100%); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; box-shadow:0 0 60px rgba(160,85,255,0.3); }
.hero-visual-content { text-align:center; z-index:2; }

.section { position:relative; z-index:1; padding:80px; }

.featured-card { display:flex; gap:48px; border-radius:32px; background:#0F0F22; overflow:hidden; align-items:center; box-shadow:0 8px 32px rgba(74,134,232,0.12); cursor:pointer; transition:transform 0.3s,box-shadow 0.3s; }

.featured-info { flex:1; padding:20px 20px 20px 0; display:flex; flex-direction:column; gap:16px; }

.story-desc { font-size:16px; color:#9B9BB5; line-height:1.75; }
.story-meta { display:flex; gap:24px; font-size:14px; color:#7B8BA0; }
.read-btn { display:inline-flex; align-items:center; gap:6px; padding:14px 28px; border-radius:28px; background:#4A86E8; color:#FFF; font-size:16px; font-weight:600; cursor:pointer; border:none; width:fit-content; transition:background 0.3s,transform 0.3s; }
.read-btn:hover { background:#5C96F5; transform:translateY(-2px); }

.cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.cat-card { border-radius:32px; background:#0F0F22; overflow:hidden; cursor:pointer; transition:transform 0.3s,box-shadow 0.3s; }
.cat-card:hover { transform:translateY(-4px); }
.cat-card:nth-child(1):hover { box-shadow:0 8px 24px rgba(255,215,0,0.15); }
.cat-card:nth-child(2):hover { box-shadow:0 8px 24px rgba(74,134,232,0.15); }
.cat-card:nth-child(3):hover { box-shadow:0 8px 24px rgba(92,201,208,0.15); }
.cat-cover { height:200px; display:flex; align-items:center; justify-content:center; border-radius:24px; font-size:80px; }
.cat-cover.cn { background:linear-gradient(135deg,rgba(200,50,50,0.5),rgba(200,150,25,0.3)); }
.cat-cover.gr { background:linear-gradient(135deg,rgba(38,102,204,0.5),rgba(102,153,255,0.3)); }
.cat-cover.no { background:linear-gradient(135deg,rgba(25,153,153,0.5),rgba(76,204,230,0.3)); }
.cat-info { padding:0 20px 20px; display:flex; flex-direction:column; gap:8px; }
.cat-info h3 { font-family:'Noto Serif SC','SimSun',serif; font-size:24px; font-weight:700; }
.cat-info span { font-size:14px; color:#9B9BB5; }

.cal-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.cal-card { border-radius:24px; background:#0F0F22; padding:20px; display:flex; flex-direction:column; align-items:center; gap:12px; transition:transform 0.3s,background 0.3s; }
.cal-card:hover { transform:translateY(-2px); }
.cal-card.today { background:linear-gradient(135deg,rgba(74,134,232,0.2),rgba(160,85,255,0.15)); border:1px solid rgba(74,134,232,0.3); }
.cal-dot { width:12px; height:12px; border-radius:50%; }
.cal-dot.done { background:#7ED4A0; }
.cal-dot.pending { background:#7B8BA0; }
.cal-date { font-size:18px; font-weight:700; }
.cal-story { font-size:14px; font-weight:500; }
.cal-card.today .cal-story { color:#FFD700; }
.cal-card:not(.today) .cal-story { color:#9B9BB5; }
.cal-tag { font-size:12px; color:#7B8BA0; }

.filter-row { display:flex; gap:12px; }
.filter-item { font-size:15px; font-weight:500; color:#9B9BB5; cursor:pointer; background:none; border:none; transition:color 0.3s; }
.filter-item.active,.filter-item:hover { color:#4A86E8; font-weight:600; }
.story-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.story-card { border-radius:24px; background:#0F0F22; overflow:hidden; cursor:pointer; transition:transform 0.3s,box-shadow 0.3s; }
.story-card:hover { transform:translateY(-4px); }
.story-card[data-cat="gr"]:hover { box-shadow:0 6px 20px rgba(74,134,232,0.15); }
.story-card[data-cat="cn"]:hover { box-shadow:0 6px 20px rgba(255,215,0,0.15); }
.story-card[data-cat="no"]:hover { box-shadow:0 6px 20px rgba(92,201,208,0.15); }
.story-cover { height:200px; display:flex; align-items:center; justify-content:center; font-size:80px; border-radius:16px; }
.story-cover.gr { background:linear-gradient(135deg,rgba(38,76,153,0.6),rgba(76,140,242,0.4)); }
.story-cover.cn { background:linear-gradient(135deg,rgba(200,50,50,0.5),rgba(230,150,25,0.4)); }

.story-info h4 { font-family:'Noto Serif SC','SimSun',serif; font-size:18px; font-weight:700; }
.story-info p { font-size:13px; color:#9B9BB5; line-height:1.5; }

/* ===== TTS 鏈楄鎸夐挳 ===== */
.tts-bar { display:flex; gap:10px; margin:16px 0; align-items:center; flex-wrap:wrap; }
.tts-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:12px 22px; border-radius:24px; font-size:15px; font-weight:600;
  cursor:pointer; border:none; transition:all 0.3s;
}
.tts-play { background:linear-gradient(135deg,#FF6B9D,#C44DFF); color:#FFF; }
.tts-play:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(196,77,255,0.4); }
.tts-pause { background:rgba(255,215,0,0.2); color:#FFD700; border:1px solid rgba(255,215,0,0.3); }
.tts-resume { background:rgba(72,199,142,0.2); color:#48C78E; border:1px solid rgba(72,199,142,0.3); }
.tts-stop { background:rgba(255,255,255,0.08); color:#9B9BB5; border:1px solid rgba(255,255,255,0.1); }
.tts-speed { display:flex; gap:4px; margin-left:8px; }
.tts-speed button {
  width:36px; height:36px; border-radius:50%; font-size:13px; font-weight:600;
  cursor:pointer; border:1px solid rgba(255,255,255,0.15); background:transparent;
  color:#9B9BB5; transition:all 0.2s;
}
.tts-speed button.active { background:rgba(74,134,232,0.3); border-color:#4A86E8; color:#FFF; }
.tts-speed button:hover { border-color:#4A86E8; }
.tts-status { font-size:13px; color:#7ED4A0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.tts-dot-pulse { width:8px; height:8px; border-radius:50%; background:#7ED4A0; animation:pulse 1s infinite; flex-shrink:0; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }

/* 鏈楄杩涘害鏉?*/
.tts-progress-wrap { display:flex; align-items:center; gap:12px; margin:8px 0 16px; }
.tts-progress-bar {
  flex:1; height:6px; border-radius:3px;
  background:rgba(255,255,255,0.08); overflow:hidden;
}
.tts-progress-fill {
  height:100%; border-radius:3px; width:0%;
  background:linear-gradient(90deg,#FF6B9D,#C44DFF,#4A86E8);
  transition:width 0.4s ease;
}
.tts-progress-text { font-size:12px; color:#9B9BB5; white-space:nowrap; min-width:70px; }
.tts-engine-label { font-size:11px; color:#FFD700; margin-top:2px; }

/* 闊宠皟鎸夐挳澶嶇敤 tts-speed 鏍峰紡 */
.tts-pitch button { width:auto; padding:0 10px; }

/* 鏁呬簨璇︽儏寮圭獥 */
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5,5,15,0.9); backdrop-filter:blur(10px); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:#0F0F22; border-radius:32px; padding:48px; max-width:820px; width:92%; max-height:88vh; overflow-y:auto; position:relative; box-shadow:0 0 80px rgba(160,85,255,0.3); }
.modal-close { position:absolute; top:20px; right:24px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; color:#FFF; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.3s; }
.modal-close:hover { background:rgba(255,255,255,0.15); }
.modal h2 { font-family:'Noto Serif SC','SimSun',serif; font-size:32px; margin-bottom:8px; }
.modal-meta { color:#7B8BA0; font-size:14px; margin-bottom:8px; }
.modal-cover-placeholder { width:100%; height:200px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:80px; margin-bottom:16px; }
.modal-body { font-size:16px; color:#C8C8DD; line-height:2.1; }
.modal-body p { margin-bottom:14px; }

.footer { background:#070712; padding:60px 80px; position:relative; z-index:1; }
.footer-top { display:flex; gap:80px; margin-bottom:40px; }
.footer-brand { width:300px; display:flex; flex-direction:column; gap:16px; }

.footer-links { display:flex; flex-direction:column; gap:14px; }

.footer-links a { font-size:14px; color:#7B8BA0; cursor:pointer; transition:color 0.3s; text-decoration:none; }
.footer-links a:hover { color:#4A86E8; }
.footer-bottom { display:flex; justify-content:space-between; align-items:center; padding-top:24px; border-top:1px solid rgba(255,255,255,0.06); }
.footer-bottom span { font-size:13px; color:#7B8BA0; }

/* 鍔犺浇鏇村鎸夐挳 */

.load-more-btn:hover { background:rgba(74,134,232,0.25); transform:translateY(-2px); }

@media(max-width:1200px){

  .cat-grid,.story-grid{grid-template-columns:repeat(2,1fr)}

  .header{padding:0 40px}

@media(max-width:768px){

}
</style>
</head>

// ============ 鐢熸垚鏁呬簨鍗＄墖 ============
function renderStoryCards(filter='all') {
  const grid = document.getElementById('storyGrid');
  grid.innerHTML = '';
  const keys = Object.keys(stories);
  for (const key of keys) {
    const s = stories[key];
    const cat = s.tagClass === 'tag-gold' ? 'cn' : s.tagClass === 'tag-blue' ? 'gr' : 'no';
    if (filter !== 'all' && cat !== filter) continue;
    const card = document.createElement('div');
    card.className = 'story-card';
    card.dataset.cat = cat;
    card.innerHTML = `<div class="story-cover ${s.coverClass}">${s.cover}</div>
      <div class="story-info">
        <div class="tag ${s.tagClass}">${s.tag}</div>
        <h4>${s.title}</h4>
        <p>${s.desc}</p>
      </div>`;
    card.addEventListener('click', () => openStory(key));
    grid.appendChild(card);
  }
}
renderStoryCards();

// ============ 鍒嗙被绛涢€?============
function filterStories(cat) {
  renderStoryCards(cat);
  document.querySelectorAll('.filter-item').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === (cat==='all'?'鍏ㄩ儴':cat==='cn'?'涓浗':cat==='gr'?'甯岃厞':'鍖楁'));
  });
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat || (cat==='all' && b.dataset.cat==='all'));
  });
  document.getElementById('stories').scrollIntoView({behavior:'smooth'});
}

function loadVoices() {
  return new Promise((resolve) => {
    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length > 0) {
      selectBestVoice(voices);
      resolve();
    } else {
      window.speechSynthesis.onvoiceschanged = () => {
        const v = window.speechSynthesis.getVoices();
        selectBestVoice(v);
        window.speechSynthesis.onvoiceschanged = null;
        resolve();
      };
      // 3绉掕秴鏃跺洖閫€
      setTimeout(() => {
        if (!ttsVoicesReady) { selectBestVoice(window.speechSynthesis.getVoices()); resolve(); }
      }, 3000);
    }
  });
}

function selectBestVoice(voices) {
  const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
  if (zhVoices.length === 0) { ttsBestVoice = null; ttsVoicesReady = true; return; }

  // 馃 绗竴浼樺厛锛氬井杞?Azure Neural 濂冲０锛圗dge 娴忚鍣ㄥ彲鐢級鈥斺€?鏈€鎺ヨ繎"娓呰剢鐢滅編濂冲澹?
  const neuralOrder = [
    'XiaoxiaoNeural',    // 鈽?寰蒋Azure锛氭椿娉煎皯濂冲０锛屾竻鑴嗙敎缇?(Edge)
    'XiaoyiNeural',      // 鈽?寰蒋Azure锛氭俯鏌旂煡鎬уコ澹?(Edge)
    'XiaochenNeural',    //   寰蒋Azure锛氳嚜鐒跺コ澹?(Edge)
    'XiaohanNeural',     //   寰蒋Azure锛氱敎缇庡皯濂?(Edge)
    'YunxiNeural',       //   寰蒋Azure锛氭椿娉肩敺澹帮紙fallback锛?    'Xiaoxiao',          //   寰蒋 Online锛氬皯濂冲０
    'Xiaoyi',            //   寰蒋 Online锛氬コ澹?    'YunyangNeural',     //   寰蒋Azure锛氫笓涓氭挱鎶ョ敺澹?  ];

  // 鎸変紭鍏堢骇鏌ユ壘
  for (const name of neuralOrder) {
    const found = zhVoices.find(v => v.name.includes(name));
    if (found) { ttsBestVoice = found; break; }
  }

  // 馃 绗簩浼樺厛锛欸oogle 涓枃濂冲０锛圕hrome 鍙敤锛?  if (!ttsBestVoice) {
    ttsBestVoice = zhVoices.find(v => v.name.includes('Female') || v.name.includes('female') || v.name.includes('濂?));
  }

  // 馃 绗笁浼樺厛锛氫换鎰忛珮璐ㄩ噺涓枃璇煶
  if (!ttsBestVoice) {
    ttsBestVoice = zhVoices.find(v =>
      v.name.includes('Google') || v.name.includes('Microsoft') ||
      v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Wavenet')
    );
  }

  // 馃弲 绗洓浼樺厛锛氫换鎰忎腑鏂囪闊?  if (!ttsBestVoice) {
    ttsBestVoice = zhVoices.find(v => v.localService === false) || zhVoices[0];
  }

  // 璁剧疆寮曟搸鏍囩
  if (ttsBestVoice) {
    if (ttsBestVoice.name.includes('Neural')) {
      ttsEngineLabel = '寰蒋 Azure 绁炵粡缃戠粶璇煶寮曟搸';
    } else if (ttsBestVoice.name.includes('Google') || ttsBestVoice.name.includes('Wavenet')) {
      ttsEngineLabel = 'Google 绁炵粡缃戠粶璇煶寮曟搸';
    } else if (ttsBestVoice.name.includes('Xiaoxiao') || ttsBestVoice.name.includes('Xiaoyi')) {
      ttsEngineLabel = '寰蒋鍦ㄧ嚎璇煶寮曟搸';
    } else {
      ttsEngineLabel = '绯荤粺璇煶寮曟搸';
    }
  }
  ttsVoicesReady = true;
  console.log('馃帣锔?宸查€夋嫨璇煶:', ttsBestVoice?.name, '| 寮曟搸:', ttsEngineLabel);
}

// 椤甸潰鍔犺浇鏃堕鍔犺浇璇煶
loadVoices();

// ---- 鏅鸿兘鍒嗗彞锛氭寜鏍囩偣鎷嗗垎锛岀‘淇濊嚜鐒惰妭濂?----
function splitSentences(text) {
  // 鍏堟寜鍙ユ湯鏍囩偣鍒嗗壊
  const raw = text.split(/(?<=[銆傦紒锛??\n])/g);
  const result = [];
  for (let s of raw) {
    s = s.trim();
    if (!s) continue;
    // 濡傛灉鍙ュ瓙澶暱(>180瀛?锛屾寜閫楀彿浜屾鍒嗗壊
    if (s.length > 180) {
      const sub = s.split(/(?<=[锛岋紱锛?;:])/g);
      for (let ss of sub) {
        ss = ss.trim();
        if (ss) result.push(ss);
      }
    } else {
      result.push(s);
    }
  }
  return result;
}

// ---- 鏂囨湰杞函鏂囨湰 ----
function getStoryPlainText(key) {
  const tmp = document.createElement('div');
  tmp.innerHTML = stories[key].content;
  return tmp.textContent.trim();
}

// ---- 寮€濮嬫湕璇?----
function startTTS(key) {
  stopTTS();
  ttsSentences = splitSentences(getStoryPlainText(key));
  ttsSentenceIdx = 0;
  ttsPaused = false;

  if (ttsSentences.length === 0) return;

  // 纭繚璇煶宸插姞杞?  if (!ttsVoicesReady) {
    loadVoices().then(() => speakNextSentence());
  } else {
    speakNextSentence();
  }
  updateTTSBar('playing');
}

// ---- 鏈楄涓嬩竴鍙?----
function speakNextSentence() {
  if (ttsPaused) return;
  if (ttsSentenceIdx >= ttsSentences.length) {
    stopTTS();
    return;
  }

  const sentence = ttsSentences[ttsSentenceIdx];
  ttsSentenceIdx++;

  ttsUtterance = new SpeechSynthesisUtterance(sentence);
  ttsUtterance.lang = 'zh-CN';
  ttsUtterance.rate = ttsSpeed;
  ttsUtterance.pitch = ttsPitch;
  ttsUtterance.volume = ttsVolume;

  if (ttsBestVoice) {
    ttsUtterance.voice = ttsBestVoice;
  }

  // 鏈楄缁撴潫鍥炶皟
  ttsUtterance.onend = () => {
    if (!ttsPaused) {
      // 鍙ラ棿鑷劧鍋滈】锛氶€楀彿缁撳熬50ms锛屽彞鍙风粨灏?20ms锛屾鏈?00ms
      const lastChar = sentence.slice(-1);
      let pause = 100;
      if (lastChar === '锛? || lastChar === '锛? || lastChar === ',') pause = 50;
      if (lastChar === '\n' || sentence.endsWith('</p>')) pause = 200;
      setTimeout(() => speakNextSentence(), pause);
    }
  };

  // 閿欒澶勭悊
  ttsUtterance.onerror = (e) => {
    if (e.error !== 'canceled' && e.error !== 'interrupted') {
      console.warn('鏈楄閿欒:', e.error);
      setTimeout(() => { if (!ttsPaused) speakNextSentence(); }, 200);
    }
  };

  // 鏈楄杈圭晫浜嬩欢锛堢敤浜庨珮浜綋鍓嶅彞瀛愶級
  ttsUtterance.onboundary = (e) => {
    if (e.name === 'sentence') {
      highlightCurrentSentence(ttsSentenceIdx - 1);
    }
  };

  window.speechSynthesis.speak(ttsUtterance);

  // 楂樹寒褰撳墠鍙ュ瓙
  highlightCurrentSentence(ttsSentenceIdx - 1);

  // 鏇存柊杩涘害
  updateProgress();
}

// ---- 楂樹寒褰撳墠鍙ュ瓙 ----
function highlightCurrentSentence(idx) {
  const body = document.querySelector('.modal-body');
  if (!body) return;
  const allText = body.querySelectorAll('p');
  // 绠€鍗曢珮浜細缁欐暣涓?modal-body 鍔犱釜鎸囩ず
  if (idx >= 0 && idx < ttsSentences.length) {
    const progressPct = Math.round((idx / ttsSentences.length) * 100);
    const progBar = document.getElementById('ttsProgressFill');
    if (progBar) progBar.style.width = progressPct + '%';
  }
}

function updateProgress() {
  const progText = document.getElementById('ttsProgressText');
  if (progText && ttsSentences.length > 0) {
    progText.textContent = `绗?${ttsSentenceIdx}/${ttsSentences.length} 鍙;
  }
}

// ---- 鏆傚仠 ----
function togglePauseResume() {
  if (ttsState === 'playing') {
    // 姝ｅ湪鏈楄 鈫?鏆傚仠
    ttsPaused = true;
    window.speechSynthesis.cancel();
    updateTTSBar('paused');
    // 鏇存柊鎸夐挳鏂囧瓧
    document.querySelectorAll('.tts-toggle').forEach(b => { b.textContent = '鈻讹笍 缁х画'; b.className = 'tts-btn tts-resume tts-toggle'; });
  } else if (ttsState === 'paused') {
    // 宸叉殏鍋?鈫?缁х画
    ttsPaused = false;
    speakNextSentence();
    updateTTSBar('playing');
    document.querySelectorAll('.tts-toggle').forEach(b => { b.textContent = '鈴革笍 鏆傚仠'; b.className = 'tts-btn tts-pause tts-toggle'; });
  }
}

// ---- 鍚戝悗鍏煎 ----
function pauseTTS() { togglePauseResume(); }
function resumeTTS() { togglePauseResume(); }

// ---- 鍋滄 ----
function stopTTS() {
  ttsPaused = false;
  ttsSentenceIdx = 0;
  ttsSentences = [];
  window.speechSynthesis.cancel();
  ttsUtterance = null;
  updateTTSBar('stopped');
  // 閲嶇疆杩涘害鏉?  const progBar = document.getElementById('ttsProgressFill');
  if (progBar) progBar.style.width = '0%';
  const progText = document.getElementById('ttsProgressText');
  if (progText) progText.textContent = '';
}

// ---- 璁剧疆璇€?----
function setTTSSpeed(speed) {
  ttsSpeed = speed;
  document.querySelectorAll('.tts-speed button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.speed) === speed);
  });
  // 濡傛灉姝ｅ湪鏈楄锛岀瓑褰撳墠鍙ョ粨鏉熷悗鑷姩搴旂敤鏂拌閫燂紙涓嶉渶瑕佷腑鏂級
  console.log('馃帣锔?璇€熷凡璁剧疆涓?', speed, '鍊?);
}

// ---- 璁剧疆闊宠皟 ----
function setTTSPitch(pitch) {
  ttsPitch = pitch;
  document.querySelectorAll('.tts-pitch button').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.pitch) === pitch);
  });
}

// ---- UI 鐘舵€佹洿鏂?----
let ttsState = 'stopped';
function updateTTSBar(state) {
  ttsState = state;
  const bar = document.getElementById('ttsBar');
  if (!bar) return;
  const statusEl = bar.querySelector('.tts-status-text');
  const dotEl = bar.querySelector('.tts-dot-pulse');
  const engineEl = bar.querySelector('.tts-engine-label');

  if (state === 'playing') {
    if (statusEl) statusEl.textContent = '馃攰 姝ｅ湪鏈楄...';
    if (dotEl) dotEl.style.display = 'inline-block';
    if (engineEl) engineEl.textContent = ttsEngineLabel;
    // 鏇存柊鎵€鏈?toggle 鎸夐挳
    document.querySelectorAll('.tts-toggle').forEach(b => {
      b.textContent = '鈴革笍 鏆傚仠'; b.className = 'tts-btn tts-pause tts-toggle';
    });
  } else if (state === 'paused') {
    if (statusEl) statusEl.textContent = '鈴革笍 宸叉殏鍋滐紙鐐瑰嚮缁х画锛?;
    if (dotEl) dotEl.style.display = 'none';
    document.querySelectorAll('.tts-toggle').forEach(b => {
      b.textContent = '鈻讹笍 缁х画'; b.className = 'tts-btn tts-resume tts-toggle';
    });
  } else {
    if (statusEl) statusEl.textContent = '馃帶 鐐瑰嚮寮€濮嬫湕璇?;
    if (dotEl) dotEl.style.display = 'none';
    const progBar = document.getElementById('ttsProgressFill');
    if (progBar) progBar.style.width = '0%';
    const progText = document.getElementById('ttsProgressText');
    if (progText) progText.textContent = '';
    document.querySelectorAll('.tts-toggle').forEach(b => {
      b.textContent = '鈴革笍 鏆傚仠'; b.className = 'tts-btn tts-pause tts-toggle';
    });
  }
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){ entry.target.style.opacity='1'; entry.target.style.transform='translateY(0)'; }
  });
}, {threshold:0.1});

  });
